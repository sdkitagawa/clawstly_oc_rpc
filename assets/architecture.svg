    <text x="95" y="36" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5c5147">aggregate.json</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">~/.clawstly-oc-rpc</text>
    <text x="95" y="74" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">sessions · tokens · cost</text>
  </g>

  <!-- dashboard server -->
  <g transform="translate(1028 320)">
    <rect x="4" y="5" width="190" height="86" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="86" rx="12" fill="#f6dccb" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c2491e">server/index.js</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">127.0.0.1:47474</text>
    <text x="95" y="74" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">/api/* · /events (SSE)</text>
  </g>

  <!-- ── row 3: shared files + browser ── -->
  <!-- config + opencode registration -->
  <g transform="translate(48 485)">
    <rect x="4" y="5" width="435" height="85" rx="12" fill="#e1d6c0"/>
    <rect width="435" height="85" rx="12" fill="#ebe2d2" stroke="#8a7c6d" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="217" y="35" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5c5147">config.json · opencode.jsonc</text>
    <text x="217" y="56" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">single plugin registration · displayModel / displayMetric · privacy</text>
    <text x="217" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">read by daemon, dashboard and CLI</text>
  </g>

  <!-- temp runtime files -->
  <g transform="translate(538 485)">
    <rect x="4" y="5" width="190" height="85" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="85" rx="12" fill="#ebe2d2" stroke="#8a7c6d" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="95" y="35" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5c5147">OS temp</text>
    <text x="95" y="56" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">stopped · daemon.pid</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">daemon.log · model-history</text>
  </g>

  <!-- user data dir -->
  <g transform="translate(783 485)">
    <rect x="4" y="5" width="190" height="85" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="85" rx="12" fill="#ebe2d2" stroke="#8a7c6d" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="95" y="35" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#5c5147">user data dir</text>
    <text x="95" y="56" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">aggregate.json</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">scan-cache.json</text>
  </g>

  <!-- browser -->
  <g transform="translate(1028 485)">
    <rect x="4" y="5" width="190" height="85" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="85" rx="12" fill="#fbf7ef" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="disp" font-size="14" font-weight="700" fill="#1a1611">Browser</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">dashboard · /settings</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">same-origin POSTs</text>
  </g>

  <!-- footnote -->
  <text x="40" y="625" class="mono" font-size="11" fill="#8a7c6d">no database · no message bus · one runtime dependency (@opencode/plugin) · loopback-only dashboard · per-session state files replace the upstream OpenCode Clawstly hook path</text>
</svg>
