    <text x="95" y="74" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">src/cli.js · commands.js</text>
  </g>

  <!-- scanner.js -->
  <g transform="translate(538 320)">
    <rect x="4" y="5" width="190" height="86" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="86" rx="12" fill="#f6dccb" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#c2491e">scanner.js</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">state files → stats</text>
    <text x="95" y="74" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">incremental scan cache</text>
  </g>

