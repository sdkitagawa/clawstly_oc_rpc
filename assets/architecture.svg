    <rect x="4" y="5" width="190" height="84" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="84" rx="12" fill="#f6dccb" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c2491e">state-&lt;id&gt;.json</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">OS temp · per session</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">atomic writes</text>
  </g>

  <!-- daemon.js -->
  <g transform="translate(783 122)">
    <rect x="4" y="5" width="190" height="84" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="84" rx="12" fill="#f6dccb" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#c2491e">daemon.js</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">presence renderer</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">format · privacy · pricing</text>
  </g>

  <!-- Discord desktop -->
  <g transform="translate(1028 122)">
    <rect x="4" y="5" width="190" height="84" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="84" rx="12" fill="#fbf7ef" stroke="#1a1611" stroke-width="2"/>
    <rect x="19" y="29" width="11" height="11" rx="2.5" fill="#5865f2"/>
    <text x="100" y="38" text-anchor="middle" class="disp" font-size="14" font-weight="700" fill="#1a1611">Discord desktop</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">Rich Presence · IPC</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">named pipe / unix socket</text>
  </g>

  <!-- ── row 2: aggregation + control + server ── -->
  <!-- launchers -->
  <g transform="translate(48 320)">
    <rect x="4" y="5" width="190" height="86" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="86" rx="12" fill="#fbf7ef" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#1a1611">run.* launchers</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">cmd · bat · ps1 · sh</text>
    <text x="95" y="74" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">same CLI underneath</text>
