<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Clawstly OC RPC - Current Architecture</title>
  <desc id="desc">OpenCode V2 loads the registered plugin/index.ts, whose hooks and events write one state file per session in the OS temp directory. The daemon reads those state files, renders presence with format.js, privacy and pricing data, and sends SET_ACTIVITY frames over local Discord IPC to the desktop client. scanner.js rolls the same state files into aggregate.json in the user data directory, and the plugin records aggregate events there too. A localhost-only Node server on port 47474 serves the dashboard and settings pages over HTTP with an SSE refresh stream. Launchers and the CLI start and stop the daemon and server and manage config.json and the single plugin registration in opencode.jsonc.</desc>

  <defs>
    <style>
      .disp { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace; }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a1611" opacity="0.07"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1 L9 5 L0.5 9" fill="none" stroke="#5c5147" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrControl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1 L9 5 L0.5 9" fill="none" stroke="#b8552f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="650" fill="#f4ede0"/>
  <rect width="1280" height="650" fill="url(#dots)"/>
  <rect width="1280" height="7" fill="#d97757"/>

  <!-- ── masthead ── -->
  <text x="40" y="48" class="disp" font-size="25" font-weight="800" letter-spacing="-0.6" fill="#2b2722">Clawstly OC RPC <tspan fill="#d97757">- Current Architecture</tspan></text>
  <text x="40" y="73" class="mono" font-size="12" fill="#6b6357">OpenCode V2 plugin → local state files → Discord IPC · localhost dashboard + CLI control plane</text>

  <!-- ── swimlanes ── -->
  <g fill="#efe6d6" stroke="#d8cbb7" stroke-width="1.5">
    <rect x="28" y="92" width="1224" height="138" rx="18"/>
    <rect x="28" y="290" width="1224" height="140" rx="18"/>
    <rect x="28" y="450" width="1224" height="140" rx="18"/>
  </g>
  <g class="mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#b8552f">
    <text x="44" y="112">PRESENCE PATH</text>
    <text x="44" y="310">AGGREGATION + LOCAL DASHBOARD</text>
    <text x="44" y="470">SHARED FILES + UI</text>
  </g>

  <!-- ── edges (drawn first, boxes sit on top) ── -->
  <g fill="none" stroke="#5c5147" stroke-width="2" marker-end="url(#arr)">
    <!-- presence path -->
    <line x1="238" y1="164" x2="293" y2="164"/>
    <line x1="483" y1="164" x2="538" y2="164"/>
    <line x1="728" y1="164" x2="783" y2="164"/>
    <line x1="973" y1="164" x2="1028" y2="164"/>
    <!-- state files → scanner, aggregate → daemon -->
    <line x1="600" y1="206" x2="600" y2="320"/>
    <line x1="830" y1="320" x2="830" y2="206"/>
    <!-- launchers → CLI, scanner → aggregate → server -->
    <line x1="238" y1="363" x2="293" y2="363"/>
    <line x1="728" y1="363" x2="783" y2="363"/>
    <line x1="973" y1="363" x2="1028" y2="363"/>
    <!-- server → browser, CLI → config -->
    <line x1="1123" y1="406" x2="1123" y2="485"/>
    <line x1="388" y1="406" x2="388" y2="485"/>
  </g>

  <!-- control bus: CLI (and plugin autostart) manage the daemon and dashboard server -->
  <g fill="none" stroke="#b8552f" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrControl)" opacity="0.85">
    <path d="M388 320 V262 H920 V206"/>
    <path d="M1123 262 V320"/>
    <path d="M420 206 V262"/>
  </g>
  <text x="700" y="254" text-anchor="middle" class="mono" font-size="9.5" fill="#b8552f">control</text>
  <text x="970" y="254" text-anchor="middle" class="mono" font-size="9.5" fill="#b8552f">start / stop / restart / source</text>
  <text x="428" y="230" class="mono" font-size="9" fill="#b8552f">autostart</text>

  <!-- ── edge labels ── -->
  <g class="mono" font-size="9.5" fill="#5c5147" text-anchor="middle">
    <text x="265" y="222">events</text>
    <text x="510" y="222">writes</text>
    <text x="755" y="222">reads</text>
    <text x="1000" y="222">IPC</text>
    <text x="265" y="420">runs</text>
    <text x="755" y="420">rolls up</text>
    <text x="1000" y="420">reads</text>
  </g>
  <g class="mono" font-size="9.5" fill="#5c5147">
    <text x="590" y="304" text-anchor="end">aggregates</text>
    <text x="840" y="304" text-anchor="start">stats</text>
    <text x="1135" y="452" text-anchor="start">HTTP · SSE</text>
    <text x="398" y="452" text-anchor="start">reads / writes</text>
  </g>

  <!-- ── row 1: presence path ── -->
  <!-- OpenCode V2 -->
  <g transform="translate(48 122)">
    <rect x="4" y="5" width="190" height="84" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="84" rx="12" fill="#fbf7ef" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="disp" font-size="15" font-weight="700" fill="#1a1611">OpenCode V2</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="10" fill="#8a7c6d">session lifecycle</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">registered plugin host</text>
  </g>

  <!-- plugin/index.ts -->
  <g transform="translate(293 122)">
    <rect x="4" y="5" width="190" height="84" rx="12" fill="#e1d6c0"/>
    <rect width="190" height="84" rx="12" fill="#f6dccb" stroke="#1a1611" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#c2491e">plugin/index.ts</text>
    <text x="95" y="57" text-anchor="middle" class="mono" font-size="9.5" fill="#8a7c6d">hooks + events → state / stats</text>
    <text x="95" y="73" text-anchor="middle" class="mono" font-size="9" fill="#8a7c6d">no hook.js in V2</text>
  </g>

  <!-- per-session state files -->
